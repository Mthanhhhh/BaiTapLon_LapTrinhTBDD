server:
  address: 0.0.0.0
  shutdown: graceful
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "java.util,java.lang,com.team.ecommerce.shared.event"
        spring.json.value.default.type: java.util.LinkedHashMap
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2s
      connect-timeout: 3s
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000
  cache:
    enabled: ${CACHE_ENABLED:true}
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
