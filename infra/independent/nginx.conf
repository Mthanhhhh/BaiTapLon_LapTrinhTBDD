worker_processes auto;
events { worker_connections 2048; }
http {
 map $http_upgrade $connection_upgrade { default upgrade; "" ""; }
 resolver 127.0.0.11 valid=5s ipv6=off;
 include /etc/nginx/mime.types;
 server_tokens off;
 sendfile on;
 keepalive_timeout 65;
 gzip on;
 gzip_types application/json text/plain text/css application/javascript image/svg+xml;
 gzip_min_length 1000;
 limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
 limit_req_zone $binary_remote_addr zone=login:10m rate=2r/s;
 limit_req_status 429;
 upstream gateway_pool { zone gateways 64k; server api-gateway:8080 resolve max_fails=3 fail_timeout=5s; keepalive 32; }
 upstream auth_pool { zone auth 64k; server auth-service:8083 resolve max_fails=3 fail_timeout=5s; keepalive 16; }
 upstream product_pool { zone catalog 64k; server product-service:8084 resolve max_fails=3 fail_timeout=5s; keepalive 32; }
 upstream order_pool { zone orders 64k; server order-service:8085 resolve max_fails=3 fail_timeout=5s; keepalive 32; }
 upstream payment_pool { zone payments 64k; server payment-service:8086 resolve max_fails=3 fail_timeout=5s; keepalive 16; }
 server { listen 8081; location / { proxy_pass http://auth_pool; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; } }
 server { listen 8082; location / { proxy_pass http://product_pool; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; } }
 server { listen 8083; location / { proxy_pass http://order_pool; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host; } }
 server { listen 8084; location / { proxy_pass http://payment_pool; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; } }
 server {
  listen 8080;
  # Only cloudflared on this machine reaches the loopback-published listener.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  location = /nginx-health { access_log off; return 200 'healthy'; }
  location ~ ^/(swagger-ui|v3/api-docs|api-docs|api/dev)(/|$) { return 404; }
  location ^~ /internal/ { return 404; }
  location = /actuator/health { proxy_pass http://gateway_pool; }
  location ^~ /actuator/ { return 404; }
  location = /api/v1/auth/login { limit_req zone=login burst=10 nodelay; proxy_pass http://gateway_pool; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; }
  location /api/ {
   limit_req zone=api burst=200 nodelay;
   proxy_pass http://gateway_pool;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $http_host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
   proxy_read_timeout 75s;
  }
  location /ws/ { proxy_pass http://gateway_pool; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection upgrade; proxy_set_header Host $http_host; proxy_set_header Origin $http_origin; proxy_read_timeout 90s; }
  location / { proxy_pass http://frontend:80; proxy_set_header Host $http_host; }
 }
}
