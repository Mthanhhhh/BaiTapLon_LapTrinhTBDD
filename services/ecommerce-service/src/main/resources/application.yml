server:
  port: ${SERVER_PORT:8081}

# ===== 4 DataSource riêng biệt (mỗi module 1 database) =====
app:
  datasource:
    auth:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root123}
      driver-class-name: com.mysql.cj.jdbc.Driver
    product:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root123}
      driver-class-name: com.mysql.cj.jdbc.Driver
    order:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root123}
      driver-class-name: com.mysql.cj.jdbc.Driver
    payment:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root123}
      driver-class-name: com.mysql.cj.jdbc.Driver

  jwt:
    secret: ${JWT_SECRET:myVeryLongSecretKeyForJwtTokenGenerationAtLeast256BitsLong2024}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

spring:
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes cache
      cache-null-values: false
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ecommerce-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics