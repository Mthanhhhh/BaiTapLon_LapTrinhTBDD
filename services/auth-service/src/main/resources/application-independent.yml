server:
  address: 0.0.0.0
  shutdown: graceful
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
  task:
    scheduling:
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "java.util,java.lang,com.team.ecommerce.shared.event"
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.json.use.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 2s
      connect-timeout: 3s
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000
  cache:
    enabled: ${CACHE_ENABLED:true}
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server.error.include-message: never
server.error.include-stacktrace: never
server.error.include-binding-errors: never
spring.data.web.pageable.max-page-size: 100
spring.servlet.multipart.max-file-size: 8MB
spring.servlet.multipart.max-request-size: 8MB

app.mail.enabled: ${SMTP_ENABLED:false}
app.mail.from: ${SMTP_FROM:}

server.tomcat.threads.max: 40
server.tomcat.accept-count: 40
server.tomcat.connection-timeout: 5s
server.max-http-request-header-size: 16KB

management.metrics.tags.application: ${spring.application.name}
management.metrics.tags.instance: ${HOSTNAME:local}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.slo.http.server.requests: 50ms,100ms,250ms,500ms,1s,1500ms,3s
