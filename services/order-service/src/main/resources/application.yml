server:
  port: 8085

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
      connect-timeout: 500ms
  task:
    scheduling:
      pool:
        size: 4
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: java.util,java.lang
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  promotions:
    allowed-origins: ${PROMOTIONS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:8087}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
