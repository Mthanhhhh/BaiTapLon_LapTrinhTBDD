# Global Nginx Configuration for E-Shop Microservices / Modular Monolith
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone: 50 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Upstream to Spring Boot Service (Host machine)
    upstream backend_service {
        server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression for faster API payload transfers
        gzip on;
        gzip_types application/json text/plain text/css application/javascript;
        gzip_min_length 1000;

        # Healthcheck endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # API Reverse Proxy & Rate Limiting
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_service/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Mx-ReqToken, Keep-Alive, X-Requested-With, If-Modified-Since' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Swagger API Documentation Proxy
        location /swagger-ui/ {
            proxy_pass http://backend_service/swagger-ui/;
            proxy_set_header Host $host;
        }

        location /api-docs/ {
            proxy_pass http://backend_service/api-docs/;
            proxy_set_header Host $host;
        }
    }
}

