global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 8s
  external_labels:
    environment: personal-server
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics.token
    dns_sd_configs:
      - names: [auth-service]
        type: A
        port: 8083
        refresh_interval: 15s
  - job_name: product-service
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics.token
    dns_sd_configs:
      - names: [product-service]
        type: A
        port: 8084
        refresh_interval: 15s
  - job_name: order-service
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics.token
    dns_sd_configs:
      - names: [order-service]
        type: A
        port: 8085
        refresh_interval: 15s
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics.token
    dns_sd_configs:
      - names: [payment-service]
        type: A
        port: 8086
        refresh_interval: 15s
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/metrics.token
    dns_sd_configs:
      - names: [api-gateway]
        type: A
        port: 8080
        refresh_interval: 15s
