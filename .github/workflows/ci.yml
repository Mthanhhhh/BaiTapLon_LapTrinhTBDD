name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm --entrypoint promtool -v "$PWD/infra/independent/monitoring:/config:ro" -w /config prom/prometheus:v3.15.1 check rules alerts.yml
      - run: docker run --rm --entrypoint promtool -v "$PWD/infra/independent/monitoring:/config:ro" -w /config prom/prometheus:v3.15.1 test rules alerts.test.yml
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 scripts/check-service-boundaries.py
      - run: mvn -B -f services/${{ matrix.service }}/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: node --test tests/*.test.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact
  container-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t security-target .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: security-target
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/mobile/Dockerfile --build-arg EXPO_PUBLIC_API_URL=https://api-eshop.mtcord.io.vn -t security-web .
      - run: docker run -d --name security-web -p 18080:80 security-web
      - run: mkdir -p reports && chmod 777 reports
      - name: Passive scan of built frontend (warnings retained in report)
        run: docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:18080 -m 1 -I -J zap.json -r zap.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline
          path: reports
